{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.rbac.clusterRoleName }}
  labels:
    app.kubernetes.io/name: {{ .Values.mcpServer.name }}
    app.kubernetes.io/part-of: strands-mcp-demo
    app.kubernetes.io/component: mcp-server
    kagent.dev/source-repo: strands-mcp-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.rbac.clusterRoleName }}
  labels:
    app.kubernetes.io/name: {{ .Values.mcpServer.name }}
    app.kubernetes.io/part-of: strands-mcp-demo
    app.kubernetes.io/component: mcp-server
    kagent.dev/source-repo: strands-mcp-demo
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rbac.serviceAccountName }}
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.clusterRoleName }}
{{- end }}
