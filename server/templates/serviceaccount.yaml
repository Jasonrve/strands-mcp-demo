{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.mcpServer.name }}
    app.kubernetes.io/part-of: strands-mcp-demo
    app.kubernetes.io/component: mcp-server
    kagent.dev/source-repo: strands-mcp-demo
  annotations:
    kagent.dev/source-repo: {{ .Values.sourceRepo | quote }}
    kagent.dev/source-kind: github-repo
{{- with .Values.serviceAccount.annotations }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
