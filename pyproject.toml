[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-mcp-demo"
version = "0.1.0"
description = "Minimal strands-based MCP demo server and kagent load example"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "kubernetes>=31,<33",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strands-mcp-demo = "strands_mcp_demo.demo:main"
strands-mcp-demo-server = "strands_mcp_demo.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
